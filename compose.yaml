# Local Postgres. Spring Boot starts this automatically on `./mvnw spring-boot:run`.
# Bound to localhost only; port 15432 avoids clashing with a Postgres you may already run.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: stockportfolio
      POSTGRES_USER: stockportfolio
      POSTGRES_PASSWORD: stockportfolio
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
