name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Tests start a real Postgres with Testcontainers (Docker is available on GitHub-hosted runners).
      - name: Build and test
        run: ./mvnw -B -ntp verify
